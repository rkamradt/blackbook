name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: rkamradt/ci-workflows/.github/workflows/site-image.yml@main
    with:
      helm-chart-dir: blackbook
      build-args: |
        REACT_APP_AUTH0_DOMAIN=randyk.us.auth0.com
        REACT_APP_AUTH0_AUDIENCE=https://api.kamradtfamily.net
        REACT_APP_READ_PROFILE_URL=https://api.kamradtfamily.net/blackbook/users
    secrets: inherit
